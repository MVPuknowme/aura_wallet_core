apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aura-core-autodrill
    app.kubernetes.io/part-of: skygrid
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: aura-core-autodrill
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
