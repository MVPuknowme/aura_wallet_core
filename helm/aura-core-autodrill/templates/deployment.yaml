apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aura-core-autodrill
    app.kubernetes.io/part-of: skygrid
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-core-autodrill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aura-core-autodrill
        app.kubernetes.io/part-of: skygrid
    spec:
      containers:
        - name: command-center
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: SKYGRID_DRY_RUN_REQUIRED
              value: "{{ .Values.commandCenter.dryRunRequired }}"
            - name: SKYGRID_OPERATOR_REVIEW_REQUIRED
              value: "{{ .Values.commandCenter.operatorReviewRequired }}"
            - name: SKYGRID_L2_AUTO_SUBMIT
              value: "{{ .Values.l2.submitAutomatically }}"
