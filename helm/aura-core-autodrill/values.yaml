replicaCount: 1

image:
  repository: ghcr.io/mvpuknowme-aura-core/aura-core-autodrill
  pullPolicy: IfNotPresent
  tag: "review"

service:
  type: ClusterIP
  port: 8080

commandCenter:
  namespace: aura-core
  dryRunRequired: true
  walletSigningRequired: false
  operatorReviewRequired: true
  artifactRetentionDays: 30

l2:
  network: base
  submitAutomatically: false
  receiptVerificationRequired: true
