include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # The example app contains demo wallet screens with legacy async UI patterns.
    # Keep package CI focused on library code and the PR payload.
    - example/**
  errors:
    # Legacy generated/protobuf-style prefixes remain in wallet implementation code.
    # Keep this narrow so functional analyzer checks still run.
    library_prefixes: ignore
    unused_catch_stack: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
