name: Apply transaction verification repair

# This temporary workflow removes itself after the verified repair is committed.
on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/harden-transaction-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-transaction-verification

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply focused source patch
        run: python tool/apply_transaction_verification_patch.py

      - name: Format changed Dart files
        run: dart format lib/src/entities/aura_wallet_impl.dart test/transaction_verification_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: flutter test test/transaction_verification_test.dart

      - name: Remove one-time patch machinery
        run: |
          rm tool/apply_transaction_verification_patch.py
          rm .github/workflows/apply-transaction-verification-repair.yml

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden transaction verification with focused tests"
          git push origin "HEAD:agent/harden-transaction-verification"
