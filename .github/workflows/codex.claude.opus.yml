name: Codex Claude Opus workflow (patched)

on:
  workflow_dispatch:
    inputs:
      user_input_flag:
        description: "Set to true to satisfy Aura Core gating before execution"
        required: true
        default: "false"
      target_command:
        description: "Primary command to run"
        required: true
        default: "echo 'no target command provided' && exit 1"
      repair_command:
        description: "Repair command"
        required: false
        default: "echo 'repair placeholder'"
      node_ledger_command:
        description: "Optional node ledger build command for deployment evidence"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate gate and execute with retries
        id: exec
        env:
          USER_INPUT_FLAG: ${{ inputs.user_input_flag }}
          TARGET_COMMAND: ${{ inputs.target_command }}
          REPAIR_COMMAND: ${{ inputs.repair_command }}
        run: bash scripts/run_codex_preflight.sh

      - name: Build node ledger evidence (optional)
        id: node_ledger
        if: ${{ !cancelled() && inputs.user_input_flag == 'true' }}
        continue-on-error: true
        env:
          NODE_LEDGER_COMMAND: ${{ inputs.node_ledger_command }}
          NODE_LEDGER_ARTIFACT_DIR: artifacts/node-ledger
        run: |
          bash scripts/build_node_ledger_evidence.sh
          status=$(python3 -c "import json; print(json.load(open('artifacts/node-ledger/summary.json'))['status'])")
          echo "node_ledger_status=$status" >> "$GITHUB_OUTPUT"
          printf '### Node ledger evidence\n\nStatus: %s\n' "$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload node ledger evidence
        if: ${{ !cancelled() && steps.node_ledger.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: node-ledger-evidence
          path: artifacts/node-ledger/*
          if-no-files-found: warn

      - name: Reference-only fallback
        if: failure()
        run: echo "Reference-only mode engaged"
